# -----------------------------------------------------------------------------
# SkyFan DC (Tuya MCU) - ESPHome Configuration
# -----------------------------------------------------------------------------
# - Product: easy-skyfandc module from Egglec
# - Board: Wemos D1 Mini (ESP8266)
# - Tuya MCU over UART (UART0 GPIO1/GPIO3)
# - Optional: Light + Temperature + power sensor packages (conditionally included)
#
# Notes:
# - Conditional package inclusion uses Jinja expressions in ${ ... } and requires
#   ESPHome >= 2025.12.0
# - Logger serial is disabled because the Tuya MCU uses the UART pins
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Extenal compoents
# -----------------------------------------------------------------------------
# external_components:
#   - source:
#       type: git
#       url: https://github.com/tinglis1/esphome
#       ref: light-norestore          # or a tag/commit SHA (recommended)
#       # path: esphome/components   # only needed if your repo layout is non-standard
#     components: [ light ]

# -----------------------------------------------------------------------------
# Substitutions
# -----------------------------------------------------------------------------
substitutions:
  # ----------------------------
  # Device identity
  # ----------------------------
  name: skyfandc
  device_name: easy-skyfandc
  fan_name: SkyFanDC
  light_name: SkyFanDC-Light
  skyfan_model: "SKY1203"
  fan_rssi: "SkyFanDC-RSSI"
  
  # ----------------------------
  # Fan default settings
  # ----------------------------
  # Set to false to default the fan to OFF on every boot
  # Default speed on boot (1–6), only applies when default_fan_on is true
  default_fan_on: "false"
  default_fan_speed: "6"

# -----------------------------------------------------------------------------
# Core config
# -----------------------------------------------------------------------------
esp8266:
  board: d1_mini

esphome:
  name: ${name}
  name_add_mac_suffix: false

  min_version: 2025.12.0

  project:
    name: "tinglis1.skyfandc"
    version: "0.3"

  # If set turn the fan on when powered on.
  on_boot:
    - priority: -200
      then:
        - delay: 3s
        - if:
            condition:
              lambda: "return ${default_fan_on};"
            then:
              - fan.turn_on:
                  id: skyfandc
                  speed: ${default_fan_speed}
            else:
              - fan.turn_off: skyfandc
    - priority: -100
      then:
        - switch.turn_on: led
        - delay: 2s
        - switch.turn_off: led

#Dashboard import if you want to adopt the device on your esphome dashboard
dashboard_import:
  package_import_url: github://tinglis1/skyfandc/micro_skyfan2.yaml@Dev

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# Tuya MCU uses the UART pins, so disable the serial logger.
logger:
  baud_rate: 0

ota:
  - platform: esphome


# -----------------------------------------------------------------------------
# Tuya MCU config
# -----------------------------------------------------------------------------
wifi:
  reboot_timeout: 30min
  min_auth_mode: WPA2
  ap:
    ssid: Fallback ${name}
    password: "skyfandc"

captive_portal:

web_server:
  port: 80

# -----------------------------------------------------------------------------
# Buses / Peripherals
# -----------------------------------------------------------------------------
# Version 0.2 has an I2C JST SH 4-pin plug and uses:
#   SDA = GPIO4, SCL = GPIO5
# Version 0.1 used GPIO4 as the power pin for the NTC.
i2c:
  sda: 4
  scl: 5
  scan: true

# -----------------------------------------------------------------------------
# Tuya MCU (UART)
# -----------------------------------------------------------------------------
# UART0 pins:
#   RX = GPIO3 (RX0)
#   TX = GPIO1 (TX0)
uart:
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud_rate: 9600

tuya:
  id: tuyamcu

# -----------------------------------------------------------------------------
# OWiFi RSSI signal strength
# -----------------------------------------------------------------------------
sensor:
  - platform: wifi_signal
    name: ${fan_rssi}
    update_interval: 60s

# -----------------------------------------------------------------------------
# Fans
# -----------------------------------------------------------------------------
fan:
  - id: skyfandc
    platform: "tuya"
    speed_datapoint: 3
    switch_datapoint: 1
    direction_datapoint: 8
    name: ${fan_name}
    restore_mode: RESTORE_DEFAULT_OFF
    disabled_by_default: false
    speed_count: 6

# -----------------------------------------------------------------------------
# Lights
# -----------------------------------------------------------------------------
light:
  - id: skyfan_light
    platform: tuya
    name: ${light_name}
    switch_datapoint: 15
    dimmer_datapoint: 16
    min_value: 0
    max_value: 5
    # color_temperature_datapoint: 19
    # color_temperature_max_value: 2
    # color_temperature_invert: true
    # cold_white_color_temperature: 6500 K
    # warm_white_color_temperature: 3000 K
    restore_mode: ALWAYS_ON
    disabled_by_default: false

# -----------------------------------------------------------------------------
# Tuya Datapoint Entities
# -----------------------------------------------------------------------------
select:
  # Datapoint 2: Mode
  - id: datapoint_mode
    platform: tuya
    tuya_id: tuyamcu
    name: "${fan_name} Mode"
    enum_datapoint: 2
    options:
      0: NORMAL
      1: ECO
      2: SLEEP
    disabled_by_default: true

  # Datapoint 22: Timer
  - id: datapoint_timer
    platform: tuya
    tuya_id: tuyamcu
    name: "${fan_name} Timer"
    enum_datapoint: 22
    options:
      0: NIL
      1: 1_HOUR
      2: 2_HOUR
      3: 3_HOUR
      4: 4_HOUR
      5: 5_HOUR
      6: 6_HOUR
      7: 7_HOUR
      8: 8_HOUR
      9: 9_HOUR
      10: 10_HOUR
      11: 11_HOUR
      12: 12_HOUR
    disabled_by_default: true

  # Datapoint 119: Light Colour Temperature
  - platform: tuya
    name: "Light Colour Temperature"
    enum_datapoint: 19
    optimistic: true
    options:
      0: "Cool White"
      1: "Natural White"
      2: "Warm White"
    disabled_by_default: false
  
# -----------------------------------------------------------------------------
# Onboard LED (status indicator)
# -----------------------------------------------------------------------------
switch:
  - platform: gpio
    id: led
    pin:
      number: 2
      inverted: true
