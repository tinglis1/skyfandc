# -----------------------------------------------------------------------------
# SkyFan DC (Tuya MCU) - ESPHome Configuration
# -----------------------------------------------------------------------------
# - Product: easy-skyfandc module from Egglec
# - Board: Wemos D1 Mini (ESP8266)
# - Tuya MCU over UART (UART0 GPIO1/GPIO3)
#
# Notes:
# - Conditional package inclusion uses Jinja expressions in ${ ... } and requires
#   ESPHome >= 2025.12.0
# - Logger serial is disabled because the Tuya MCU uses the UART pins
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Extenal compoents
# -----------------------------------------------------------------------------
# external_components:
#   - source:
#       type: git
#       url: https://github.com/tinglis1/esphome
#       ref: light-norestore          # or a tag/commit SHA (recommended)
#       # path: esphome/components   # only needed if your repo layout is non-standard
#     components: [ light ]

# -----------------------------------------------------------------------------
# Substitutions
# -----------------------------------------------------------------------------
substitutions:
  # ----------------------------
  # Device identity
  # ----------------------------
  name: skyfandc
  device_name: easy-skyfandc
  fan_name: SkyFanDC
  skyfan_model: "SKY1203"
  fan_rssi: "SkyFanDC-RSSI"
  
  # ----------------------------
  # Fan default settings
  # ----------------------------
  # Set to false to default the fan to OFF on every boot
  # Default speed on boot (1–6), only applies when default_fan_on is true
  default_fan_on: "false"
  default_fan_speed: "6"

# -----------------------------------------------------------------------------
# Core config
# -----------------------------------------------------------------------------
esp8266:
  board: d1_mini

esphome:
  name: ${name}
  name_add_mac_suffix: false

  min_version: 2025.12.0

  project:
    name: "tinglis1.skyfandc"
    version: "0.3"

  # If set turn the fan on when powered on.
  on_boot:
    # - priority: -200
    #   then:
    #     - delay: 3s
    #     - if:
    #         condition:
    #           lambda: "return ${default_fan_on};"
    #         then:
    #           - fan.turn_on:
    #               id: skyfandc
    #               speed: ${default_fan_speed}
    #         else:
    #           - fan.turn_off: skyfandc
    - priority: -100
      then:
        - switch.turn_on: led
        - delay: 2s
        - switch.turn_off: led

#Dashboard import if you want to adopt the device on your esphome dashboard
# dashboard_import:
#   package_import_url: github://tinglis1/skyfandc/micro_skyfan2.yaml@fan-only3

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# Tuya MCU uses the UART pins, so disable the serial logger.
logger:
  baud_rate: 0

ota:
  - platform: esphome


# -----------------------------------------------------------------------------
# Global variables
# -----------------------------------------------------------------------------
globals:
  # Prevent feedback loops when we update HA state from Tuya updates
  - id: tuya_syncing
    type: bool
    restore_value: no
    initial_value: "false"

# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------
script:
  # Called whenever any relevant Tuya DP updates
  - id: sync_fan_from_tuya
    mode: restart
    then:
      - lambda: |-
          id(tuya_syncing) = true;
      # Small debounce to allow multiple DP updates to land before we read them
      - delay: 200ms

      - if:
          condition:
            switch.is_on: datapoint_onoff
          then:
            # If ECO mode, represent as HA speed 2
            - if:
                condition:
                  lambda: 'return id(datapoint_mode).active_index() == 1;'
                then:
                  - logger.log: "Tuya->HA sync: ON, ECO => HA speed 2"
                  - fan.turn_on:
                      id: skyfan
                      speed: 2
                      direction: !lambda |-
                        return (id(datapoint_direction).active_index() != 0)
                          ? FanDirection::REVERSE
                          : FanDirection::FORWARD;
                else:
                  # NORMAL/SLEEP: map Tuya raw speed to HA speeds
                  # Your existing logic:
                  #   raw=1 -> HA speed 1
                  #   raw>=2 -> HA speed = raw + 1
                  - lambda: |-
                      int raw = (int) id(datapoint_speed).state;
                      int ha_speed = (raw <= 1) ? 1 : (raw + 1);
                      if (ha_speed < 1) ha_speed = 1;
                      if (ha_speed > 6) ha_speed = 6;
                      ESP_LOGI("skyfan", "Tuya->HA sync: ON, mode=%d raw_speed=%d => HA speed %d",
                               id(datapoint_mode).active_index(), raw, ha_speed);
                  - fan.turn_on:
                      id: skyfan
                      speed: !lambda |-
                        int raw = (int) id(datapoint_speed).state;
                        int ha_speed = (raw <= 1) ? 1 : (raw + 1);
                        if (ha_speed < 1) ha_speed = 1;
                        if (ha_speed > 6) ha_speed = 6;
                        return ha_speed;
                      direction: !lambda |-
                        return (id(datapoint_direction).active_index() != 0)
                          ? FanDirection::REVERSE
                          : FanDirection::FORWARD;
          else:
            - logger.log: "Tuya->HA sync: OFF"
            - fan.turn_off: skyfan

      - lambda: |-
          id(tuya_syncing) = false;

# -----------------------------------------------------------------------------
# Tuya MCU config
# -----------------------------------------------------------------------------
wifi:
  reboot_timeout: 30min
  min_auth_mode: WPA2
  ap:
    ssid: Fallback ${name}
    password: "skyfandc"

captive_portal:

web_server:
  port: 80

# -----------------------------------------------------------------------------
# Buses / Peripherals
# -----------------------------------------------------------------------------
# Version 0.2 has an I2C JST SH 4-pin plug and uses:
#   SDA = GPIO4, SCL = GPIO5
# Version 0.1 used GPIO4 as the power pin for the NTC.
i2c:
  sda: 4
  scl: 5
  scan: true

# -----------------------------------------------------------------------------
# Tuya MCU (UART)
# -----------------------------------------------------------------------------
# UART0 pins:
#   RX = GPIO3 (RX0)
#   TX = GPIO1 (TX0)
uart:
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud_rate: 9600

tuya:
  id: tuyamcu
  on_datapoint_update:
    # Any relevant DP update triggers a resync into HA.
    - sensor_datapoint: 1
      datapoint_type: bool
      then:
        - script.execute: sync_fan_from_tuya
    - sensor_datapoint: 2
      datapoint_type: enum
      then:
        - script.execute: sync_fan_from_tuya
    - sensor_datapoint: 3
      datapoint_type: int
      then:
        - script.execute: sync_fan_from_tuya
    - sensor_datapoint: 8
      datapoint_type: enum
      then:
        - script.execute: sync_fan_from_tuya
    - sensor_datapoint: 22
      datapoint_type: enum
      then: []

# -----------------------------------------------------------------------------
# OWiFi RSSI signal strength
# -----------------------------------------------------------------------------
sensor:
  - platform: wifi_signal
    name: ${fan_rssi}
    update_interval: 60s

# -----------------------------------------------------------------------------
# Fans
# -----------------------------------------------------------------------------
fan:
  - id: skyfan
    platform: speed
    name: ${fan_name}
    output: skyfan_speed
    direction_output: skyfan_direction
    restore_mode: NO_RESTORE
    disabled_by_default: false
    speed_count: 6

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  # Fan speed output is float 0.0..1.0.
  # Map HA 1..6 steps onto Tuya raw 0..5.
  - id: skyfan_speed
    platform: template
    type: float
    write_action:
      then:
        - if:
            condition:
              lambda: 'return id(tuya_syncing);'
            then:
              - logger.log: "HA->Tuya speed write suppressed (tuya_syncing=true)"
            else:
              - lambda: |-
                  ESP_LOGI("skyfan", "HA->Tuya speed write: state=%0.3f", state);

              # Always push direction whenever we write speed (keeps MCU aligned)
              - select.set_index:
                  id: datapoint_direction
                  index: !lambda |-
                    return (id(skyfan).direction != FanDirection::FORWARD) ? 1 : 0;

              # OFF threshold (same behaviour as your original)
              - if:
                  condition:
                    lambda: 'return state < 0.10;'
                  then:
                    - switch.turn_off: datapoint_onoff
                  else:
                    - switch.turn_on: datapoint_onoff

                    # Convert float 0..1 to HA step 1..6
                    - lambda: |-
                        int step = (int) ceilf(state * 6.0f);  // 1..6
                        if (step < 1) step = 1;
                        if (step > 6) step = 6;

                        // HA step 1..6 -> Tuya raw 0..5
                        int raw = step - 1;
                        if (raw < 0) raw = 0;
                        if (raw > 5) raw = 5;

                        ESP_LOGI("skyfan", "HA->Tuya: step=%d => raw_speed=%d", step, raw);
                        auto call = id(datapoint_speed).make_call();
                        call.set_value(raw);
                        call.perform();

  # Implement direction_output so direction-only changes actually write to Tuya
  - id: skyfan_direction
    platform: template
    type: binary
    write_action:
      then:
        - if:
            condition:
              lambda: 'return id(tuya_syncing);'
            then:
              - logger.log: "HA->Tuya direction write suppressed (tuya_syncing=true)"
            else:
              - select.set_index:
                  id: datapoint_direction
                  index: !lambda |-
                    return (id(skyfan).direction != FanDirection::FORWARD) ? 1 : 0;

# -----------------------------------------------------------------------------
# Tuya Datapoint Entities
# -----------------------------------------------------------------------------
select:
  # Datapoint 2: Mode
  - id: datapoint_mode
    platform: tuya
    tuya_id: tuyamcu
    name: ${fan_name} Mode
    enum_datapoint: 2
    options:
      0: NORMAL
      1: ECO
      2: SLEEP
    disabled_by_default: true

  # Datapoint 8: Direction
  - id: datapoint_direction
    platform: tuya
    tuya_id: tuyamcu
    name: ${fan_name} Direction
    enum_datapoint: 8
    options:
      0: FORWARD
      1: REVERSE
    internal: true
    
  # Datapoint 22: Timer
  - id: datapoint_timer
    platform: tuya
    tuya_id: tuyamcu
    name: ${fan_name} Timer
    enum_datapoint: 22
    options:
      0: NIL
      1: 1_HOUR
      2: 2_HOUR
      3: 3_HOUR
      4: 4_HOUR
      5: 5_HOUR
      6: 6_HOUR
      7: 7_HOUR
      8: 8_HOUR
      9: 9_HOUR
      10: 10_HOUR
      11: 11_HOUR
      12: 12_HOUR
    disabled_by_default: true

  
# -----------------------------------------------------------------------------
# Switches
# -----------------------------------------------------------------------------
switch:
  # Onboard LED (status indicator)
  - platform: gpio
    id: led
    pin:
      number: 2
      inverted: true
  
  - id: datapoint_onoff
    platform: tuya
    tuya_id: tuyamcu
    name: ${fan_name} Switch
    switch_datapoint: 1
    internal: true

# -----------------------------------------------------------------------------
# number
# -----------------------------------------------------------------------------
number:
  - id: datapoint_speed
    platform: tuya
    tuya_id: tuyamcu
    name: ${fan_name} Speed
    number_datapoint: 3
    min_value: 0
    max_value: 5
    step: 1
    internal: true
