# -----------------------------------------------------------------------------
# SkyFan DC (Tuya MCU) - ESPHome Configuration
# -----------------------------------------------------------------------------
# - Product: easy-skyfandc module from Egglec
# - Board: Wemos D1 Mini (ESP8266)
# - Tuya MCU over UART (UART0 GPIO1/GPIO3)
# - Optional: Light + Temperature + power sensor packages (conditionally included)
#
# Notes:
# - Conditional package inclusion uses Jinja expressions in ${ ... } and requires
#   ESPHome >= 2025.12.0
# - Logger serial is disabled because the Tuya MCU uses the UART pins
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Extenal compoents
# -----------------------------------------------------------------------------
# external_components:
#   - source:
#       type: git
#       url: https://github.com/tinglis1/esphome
#       ref: light-norestore          # or a tag/commit SHA (recommended)
#       # path: esphome/components   # only needed if your repo layout is non-standard
#     components: [ light ]

# -----------------------------------------------------------------------------
# Substitutions
# -----------------------------------------------------------------------------
substitutions:
  # ----------------------------
  # Device identity
  # ----------------------------
  name: skyfandc
  device_name: easy-skyfandc
  fan_name: SkyFanDC
  skyfan_model: "SKY1203"
  fan_rssi: "SkyFanDC-RSSI"
  
  # ----------------------------
  # Fan default settings
  # ----------------------------
  # Set to false to default the fan to OFF on every boot
  # Default speed on boot (1–6), only applies when default_fan_on is true
  default_fan_on: "false"
  default_fan_speed: "6"

# -----------------------------------------------------------------------------
# Core config
# -----------------------------------------------------------------------------
esp8266:
  board: d1_mini

esphome:
  name: ${name}
  name_add_mac_suffix: false

  min_version: 2025.12.0

  project:
    name: "tinglis1.skyfandc"
    version: "0.3"

  # If set turn the fan on when powered on.
  on_boot:
    # - priority: -200
    #   then:
    #     - delay: 3s
    #     - if:
    #         condition:
    #           lambda: "return ${default_fan_on};"
    #         then:
    #           - fan.turn_on:
    #               id: skyfandc
    #               speed: ${default_fan_speed}
    #         else:
    #           - fan.turn_off: skyfandc
    - priority: -100
      then:
        - switch.turn_on: led
        - delay: 2s
        - switch.turn_off: led

#Dashboard import if you want to adopt the device on your esphome dashboard
# dashboard_import:
#   package_import_url: github://tinglis1/skyfandc/micro_skyfan2.yaml@Dev

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# Tuya MCU uses the UART pins, so disable the serial logger.
logger:
  baud_rate: 0

ota:
  - platform: esphome


# -----------------------------------------------------------------------------
# Tuya MCU config
# -----------------------------------------------------------------------------
wifi:
  reboot_timeout: 30min
  min_auth_mode: WPA2
  ap:
    ssid: Fallback ${name}
    password: "skyfandc"

captive_portal:

web_server:
  port: 80

# -----------------------------------------------------------------------------
# Buses / Peripherals
# -----------------------------------------------------------------------------
# Version 0.2 has an I2C JST SH 4-pin plug and uses:
#   SDA = GPIO4, SCL = GPIO5
# Version 0.1 used GPIO4 as the power pin for the NTC.
i2c:
  sda: 4
  scl: 5
  scan: true

# -----------------------------------------------------------------------------
# Tuya MCU (UART)
# -----------------------------------------------------------------------------
# UART0 pins:
#   RX = GPIO3 (RX0)
#   TX = GPIO1 (TX0)
uart:
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud_rate: 9600

tuya:
  id: tuyamcu
  on_datapoint_update:
    - sensor_datapoint: 1
      datapoint_type: bool
      then:
        - switch.turn_on: update_fan
    - sensor_datapoint: 2
      datapoint_type: enum
      then:
        - switch.turn_on: update_fan 
    - sensor_datapoint: 3
      datapoint_type: int
      then:
        - switch.turn_on: update_fan
    - sensor_datapoint: 8
      datapoint_type: enum
      then:
        - switch.turn_on: update_fan
    - sensor_datapoint: 22
      datapoint_type: enum
      then: []

# -----------------------------------------------------------------------------
# OWiFi RSSI signal strength
# -----------------------------------------------------------------------------
sensor:
  - platform: wifi_signal
    name: ${fan_rssi}
    update_interval: 60s

# -----------------------------------------------------------------------------
# Fans
# -----------------------------------------------------------------------------
fan:
  - id: skyfan
    platform: speed
    output: skyfan_speed
    direction_output: skyfan_direction
    name: ${fan_name}
    restore_mode: NO_RESTORE
    disabled_by_default: false
    speed_count: 6

output:
  # When the fan speed is changed by the fan entity in Home Assistant, update
  # the tuyamcu datapoints that control the fan motor.
  - id: skyfan_speed
    platform: template
    type: float
    write_action: 
      then:
        - if:
            condition:
              - switch.is_on: update_fan
            then:
              - switch.turn_off: update_fan            
            else:             
              - logger.log:
                  format: "skyfan_speed is %1f"
                  args: [ 'state' ]
              - select.set_index:
                  id: datapoint_direction
                  index: !lambda |-
                    return (id(skyfan).direction != FanDirection::FORWARD ? 1 : 0);              
              - if:
                  condition:
                    lambda: 'return state < 0.1 ;'
                  then:
                    - switch.turn_off: datapoint_onoff
                  else:
                    - switch.turn_on: datapoint_onoff                                     
                    - if:
                        condition:
                          lambda: 'return (state < 0.3);'
                        then:
                          - select.set_index:
                              id: datapoint_mode
                              index: 0
                          - number.set:
                              id: datapoint_speed
                              value: 1
                        else:
                          - if:
                              condition:
                                lambda: 'return (state < 0.4);'
                              then:
                                - select.set_index:
                                    id: datapoint_mode
                                    index: 1
                              else:                        
                                - select.set_index:
                                    id: datapoint_mode
                                    index: 0
                                - if:
                                    condition:
                                      lambda: 'return (state < 0.6);'
                                    then:
                                      - number.set:
                                          id: datapoint_speed
                                          value: 2
                                    else:                  
                                      - if:
                                          condition:
                                            lambda: 'return (state < 0.8);'
                                          then:
                                            - number.set:
                                                id: datapoint_speed
                                                value: 3
                                          else:                              
                                            - if:
                                                condition:
                                                  lambda: 'return (state < 0.9);'
                                                then:
                                                  - number.set:
                                                      id: datapoint_speed
                                                      value: 4
                                                else:                              
                                                  - number.set:
                                                      id: datapoint_speed
                                                      value: 5        

  - id: skyfan_direction
    platform: template
    type: binary
    write_action: []

# -----------------------------------------------------------------------------
# Tuya Datapoint Entities
# -----------------------------------------------------------------------------
select:
  # Datapoint 2: Mode
  - id: datapoint_mode
    platform: tuya
    tuya_id: tuyamcu
    name: "${fan_name} Mode"
    enum_datapoint: 2
    options:
      0: NORMAL
      1: ECO
      2: SLEEP
    disabled_by_default: true

  # Datapoint 22: Timer
  - id: datapoint_timer
    platform: tuya
    tuya_id: tuyamcu
    name: "${fan_name} Timer"
    enum_datapoint: 22
    options:
      0: NIL
      1: 1_HOUR
      2: 2_HOUR
      3: 3_HOUR
      4: 4_HOUR
      5: 5_HOUR
      6: 6_HOUR
      7: 7_HOUR
      8: 8_HOUR
      9: 9_HOUR
      10: 10_HOUR
      11: 11_HOUR
      12: 12_HOUR
    disabled_by_default: true

  
# -----------------------------------------------------------------------------
# Onboard LED (status indicator)
# -----------------------------------------------------------------------------
switch:
  - platform: gpio
    id: led
    pin:
      number: 2
      inverted: true
  # A datapoint has changed in tuyamcu. Update the fan entity in Home Assistant 
  # to be consistent with the new datapoint values.
  - id: update_fan
    platform: template
    optimistic: true
    turn_on_action:
      then:
        - delay: 200ms
        - if:
            condition: 
              - switch.is_on: datapoint_onoff
            then:
              - if:
                  condition:
                    - lambda: 'return ( id(datapoint_mode).active_index() == 1 );'
                  then:
                    - logger.log: "update_fan ECO therefore set speed 2"
                    - fan.turn_on: 
                        id: skyfan
                        speed: '2'
                        direction: !lambda |-
                          bool val = ( id(datapoint_direction).active_index() != 0 );
                          return val ? FanDirection::REVERSE : FanDirection::FORWARD;
                  else:
                    - if:
                        condition:
                          - lambda: 'return ( id(datapoint_speed).state == 1 );'
                        then:
                          - logger.log: "update_fan Set speed 1"
                          - fan.turn_on: 
                              id: skyfan
                              speed: '1'
                              direction: !lambda |-
                                bool val = ( id(datapoint_direction).active_index() != 0 );
                                return val ? FanDirection::REVERSE : FanDirection::FORWARD;
                        else:
                          - logger.log: "update_fan Set speed plus 1"
                          - fan.turn_on: 
                              id: skyfan
                              speed: !lambda |-
                                return (id(datapoint_speed).state + 1);
                              direction: !lambda |-
                                bool val = ( id(datapoint_direction).active_index() != 0 );
                                return val ? FanDirection::REVERSE : FanDirection::FORWARD;
            else:
              - logger.log: "update_fan Turn off"
              - fan.turn_off: 
                  id: skyfan            

  - id: datapoint_onoff
    platform: tuya
    tuya_id: tuyamcu
    name: ${fan_name} Switch
    switch_datapoint: 1
    internal: true


number:
  - id: datapoint_speed
    platform: tuya
    tuya_id: tuyamcu
    name: ${fan_name} Speed
    number_datapoint: 3
    min_value: 0
    max_value: 5
    step: 1
    internal: true
